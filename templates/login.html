<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

form{
    background:white;
    padding:30px;
    border-radius:10px;
    width:300px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:10px;
    background:#667eea;
    border:none;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#5563c1;
}

a{
    display:block;
    text-align:center;
    margin-top:10px;
}
</style>
</head>
<body>
    <h2>Login in</h2>
    <form action="{{url_for('login')}}" method="post">
        <input type="text" name="username" placeholder="username" required><br><br>
        <input type="password" name="password" placeholder="password" required><br><br>
        <input type="submit" value="submit">
     </form>
        {% if error%}
        <p style="color:red;">{{error}}</p>
        {% endif %}



        <p><a href="{{ url_for('forgot') }}">Forgot Password</a></p>
        <p style="margin-top:15px; text-align:center; color:white;">Don't have an account?
            <a href="{{ url_for('register') }}" 
            style="color: yellow; font-weight: bold;">
            Register</a>
        </p>

</body>
</html>
