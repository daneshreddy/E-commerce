<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
body{
    font-family: Arial;
    background:#f4f4f4;
}

.container{
    width:90%;
    margin:auto;
}

.products{
    display:grid;
    grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    text-align:center;
}

.card img{
    height:150px;
    object-fit:contain;
}

button{
    padding:8px 12px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}
</style>
</head>
<body>
    <h2>Welcome {{username}}</h2>

    <a href="{{url_for('logout')}}">logout</a>
    <h2>Products</h2>
    <a href="{{ url_for('cart') }}">View Cart</a>
    <br><br>

{% for product in products %}
<div style="border:1px solid #ccc; padding:15px; margin:15px; width:300px;">
    
    <h3>{{ product[1] }}</h3>

    <img src="{{ product[4] }}" width="200">

    <p><b>Price:</b> ₹{{ product[2] }}</p>
    <p>{{ product[3] }}</p>
    
    <a href="{{ url_for('add_to_cart', product_id=product[0]) }}">
    <button>Add to Cart</button>
</a>

</div>
{% endfor %}

</body>
</html>
