<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address</title>
    <style>
body{
    font-family:Arial;
    background:#eef2f3;
}

form{
    width:400px;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:8px;
    margin:6px 0;
}

button{
    width:100%;
    padding:10px;
    background:#28a745;
    border:none;
    color:white;
    border-radius:5px;
}
</style>
</head>
<body>
    <h2>Delivery Address</h2>

<form method="post">

    <input type="text" name="house" placeholder="House No" required><br><br>

    <input type="text" name="street" placeholder="Street Name" required><br><br>

    <input type="text" name="city" placeholder="City" required><br><br>

    <input type="text" name="state" placeholder="State" required><br><br>

    <input type="text" name="pincode" placeholder="Pincode" required><br><br>

    <input type="text" name="landmark" placeholder="Nearby Landmark"><br><br>

    <button type="submit">Place Order</button>

</form>
    
</body>
</html>
